[package]
name = "forge-build"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jade headless build/run/asm engine: Rust port of src/main/build-runner.ts"

[dependencies]
tokio = { workspace = true, features = ["process", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
forge-telemetry = { path = "../forge-telemetry" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
