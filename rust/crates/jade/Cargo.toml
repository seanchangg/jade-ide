[package]
name = "jade"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jade — memory-aware C++/Metal IDE with live GPU training visualization"

[dependencies]
# Zed's GPU-accelerated UI framework, used as a library — Jade borrows the
# engine, not the editor shell. Pinned by rev once the spike stabilizes.
gpui = { git = "https://github.com/zed-industries/zed" }
# font-kit is off by default and without it gpui_macos has no font provider —
# no text renders at all (bites every standalone GPUI consumer).
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
forge-telemetry = { path = "../forge-telemetry" }
forge-build = { path = "../forge-build" }
forge-debug = { path = "../forge-debug" }
# Editor text core (E2): rope-backed Buffer, cursors, grouped undo/redo,
# LSP-shaped incremental EditRecords, dirty tracking. Backs each OpenTab.
forge-buffer = { path = "../forge-buffer" }
# clangd LSP client (E2): diagnostics/completion/hover/definition over stdio.
forge-lsp = { path = "../forge-lsp" }
# The LSP domain vocabulary forge-lsp is built on. jade needs a few types
# forge-lsp doesn't re-export (CompletionTextEdit/TextEdit for applying
# completions); pinned to the exact version forge-lsp uses so the types unify.
lsp-types = "0.97"
forge-sysmon = { path = "../forge-sysmon" }
forge-ai = { path = "../forge-ai" }
# Headless terminal engine (PTY + alacritty grid state machine); Jade renders
# its GridSnapshots in the bottom TERMINAL strip (Phase-4 wave 2, §5.2).
forge-term = { path = "../forge-term" }
# Cross-platform filesystem watcher for the file-tree auto-refresh (§5.1); the
# recommended backend (FSEvents on macOS) is debounced 250ms in app wiring.
notify = "8"
# `signal` is additive to the workspace features: ⌃C / SIGTERM must kill the
# managed llama-server before we exit (see `spawn_signal_cleanup`).
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Read-only syntax highlighting (editor-core Step 1): the plain tree-sitter
# runtime + the C++ grammar (also drives .metal via added Metal keywords). No
# zed language/editor crates — a focused highlight query maps captures to the
# forge-dark palette (§4.2).
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
# Regex-driven static analysis for the editor decoration ports (§4.5 memory
# size annotations, §4.8 execution flow). Mirrors the TS regex/brace-count
# approach (no AST); already present transitively in the lockfile.
regex = "1"
# Error context for the bundled-icon AssetSource (assets.rs); gpui's AssetSource
# trait speaks anyhow::Result, so we surface a missing asset with .context().
anyhow = "1"
# Tensor heatmap previews are baked into a gpui RenderImage once per NEW frame
# and drawn as one textured quad (the TS putImageData→drawImage architecture) —
# painting one quad per cell per repaint was the training-view lag. Versions
# must unify with gpui's own `image`/`smallvec` (RenderImage::new takes both).
image = { version = "0.25", default-features = false }
smallvec = "1"
# Persistent run store (run_store.rs): every telemetry run's scalar/timing/
# memory series + metadata land in <workspace>/.forge/runs.db so the training
# view can overlay & compare historical runs. `bundled` compiles SQLite in —
# no system-lib version drift, same choice Zed makes for its sqlez.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Setting the app-scoped AppleFontSmoothing=0 default at startup (crisp/thin
# text, same trick as Chromium's -webkit-font-smoothing: antialiased); gpui's
# mac text system reads it to skip glyph dilation. Version matches gpui's.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
# The 3D weight grid's real GPU renderer (wg3d/metal.rs): instanced bars drawn
# with Metal into a CVPixelBuffer that gpui's `surface()` element presents
# zero-copy. Versions pinned to the ones gpui itself locks so types unify
# (core-video's CVMetalTextureCache takes a metal::Device).
metal = "0.33"
core-video = { version = "0.5.2", features = ["metal"] }

[dev-dependencies]
# test-support turns on gpui's TestAppContext/VisualTestContext so interaction
# tests can drive real clicks/keystrokes through the full window dispatch path
# (hitboxes, focus, IME) headlessly — the same harness Zed's own tests use.
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
