[package]
name = "jade-sysmon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jade system monitor: 1500ms CPU/mem poll + best-effort GPU utilization (port of src/main/system-monitor.ts)"

[dependencies]
# `process` is additive to the workspace tokio feature set — needed to run
# `ioreg` for GPU utilization.
tokio = { workspace = true, features = ["process"] }
serde = { workspace = true }
# CPU + memory sampling; disk/network/component collectors are not needed.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
