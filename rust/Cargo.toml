[workspace]
resolver = "2"
members = [
    "crates/forge-telemetry",
    "crates/forge-build",
    "crates/forge-debug",
    "crates/forge-ai",
    "crates/forge-sysmon",
    "crates/forge-term",
    "crates/jade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
